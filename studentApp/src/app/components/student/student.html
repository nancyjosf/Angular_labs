<div class="container mt-4">
  <h1 class="text-center mb-3 text-primary">Student List</h1>
  
  <div class="row">
    @for (student of students; track student.id) {
      <div class="col-md-3">
        <div class="card mb-3 shadow-sm border-0">
          <img 
            [src]="student.photoUrl" 
            class="card-img-top" 
            style="height: 200px; object-fit: cover;" 
            alt="{{ student.name }}"
          >
          <div class="card-body text-center">
            <h5 class="card-title fw-bold text-dark">{{ student.name }}</h5>
            <p class="card-text text-muted">Age: <span class="badge bg-info text-dark">{{ student.age }}</span></p>
            <button class="btn btn-outline-primary btn-sm">View Profile</button>
          </div>
        </div>
      </div>
    } 
  </div>
</div>
