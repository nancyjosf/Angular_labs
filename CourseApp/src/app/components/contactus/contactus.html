<div class="container py-5 my-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold">Get In Touch</h2>
    <p class="text-muted">Have a question? We'd love to hear from you.</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-4 mb-4">
      <div class="card border-0 shadow-sm p-4 h-100 text-center rounded-4">
        <h5 class="fw-bold text-primary mb-3">Contact Info</h5>
        <p class="mb-1 text-muted"><strong>Email:</strong> info@academy.com</p>
        <p class="mb-1 text-muted"><strong>Phone:</strong> +20 123 456 789</p>
        <p class="mb-0 text-muted"><strong>Location:</strong> Assiut, Egypt</p>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4 rounded-4">
        <form>
          <div class="mb-3">
            <label class="form-label small fw-bold">Full Name</label>
            <input type="text" class="form-control bg-light border-0" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Email Address</label>
            <input type="email" class="form-control bg-light border-0" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Message</label>
            <textarea class="form-control bg-light border-0" rows="4" placeholder="How can we help?"></textarea>
          </div>
          <button type="button" class="btn btn-primary w-100 rounded-pill py-2 shadow-sm">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
