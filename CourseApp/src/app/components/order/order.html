<div class="container mt-5">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-end border-bottom pb-3 mb-4">
    <div>
      <h2 class="fw-bold mb-1 text-dark">Available Courses</h2>
      <p class="text-muted small mb-0">Total value: <span class="text-dark fw-bold">${{ totalprice }}</span></p>
    </div>

    <div class="mt-3 mt-md-0">
      <select [(ngModel)]="selectedCategoryId" class="form-select form-select-sm border-0 bg-light px-3" style="width: 200px;">
        <option [value]="0">All Categories</option>
        @for (cat of Categories; track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-courses 
        [sendselectedCategoryId]="selectedCategoryId" 
        (onTotalpricechange)="setTotalOrederPrice($event)">
      </app-courses>
    </div>
  </div>
</div>

<style>
  .form-select {
    cursor: pointer;
    border-radius: 8px;
    color: #555;
  }
  .form-select:focus {
    box-shadow: none;
    background-color: #e9ecef;
  }
</style>
